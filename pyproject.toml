[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-duplicates"
version = "0.1.0"
description = "Scan an image library and browse it in a PyQt6 gallery sorted by duplicate groups."
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.11",
    "Pillow>=11.0",
]

[project.scripts]
image-dup = "image_duplicates.gallery:main"

[tool.setuptools.packages.find]
include = ["image_duplicates*"]