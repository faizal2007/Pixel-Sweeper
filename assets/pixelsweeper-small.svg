<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Pixel Sweeper, simplified for 16 and 24 px: the photo glyph inside the
       frame turns to mush at that size, so the shapes are chunkier, the back
       photo is a dark tone rather than a translucent white (so the two tiles
       stay distinct) and the badge is enlarged. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b7de9"/>
      <stop offset="1" stop-color="#1256b4"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="256" height="256" rx="56" ry="56"/>
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect x="0" y="0" width="256" height="256" fill="url(#tile)"/>
    <rect x="28" y="24" width="120" height="120" rx="26" ry="26" fill="#0b2a55" fill-opacity="0.55"/>
    <rect x="82" y="78" width="120" height="120" rx="26" ry="26" fill="#ffffff"/>
    <circle cx="190" cy="188" r="52" fill="#db4437" stroke="#ffffff" stroke-width="12"/>
    <rect x="166" y="180" width="48" height="16" rx="8" ry="8" fill="#ffffff"/>
  </g>
</svg>
